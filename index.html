<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c10" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Bilhete do dia com odd fora da curva." />
  <title>Bilhete do dia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://connect.facebook.net" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700&display=swap" /></noscript>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff7a00'/%3E%3Cpath d='M18 42 L32 22 L46 42' fill='none' stroke='%23fff' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <style>
    :root{
      --bg:#0b0c10; --bg-2:#12141a; --card:#171a21; --border:#262b34;
      --hot:#ff7a00; --hot-2:#ff9d33; --hot-deep:#c25a00;
      --ok:#25d366; --text:#f4f5f7; --muted:#a5acb8;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:
        radial-gradient(120% 56% at 50% -8%, rgba(255,122,0,.115) 0%, rgba(255,122,0,0) 64%),
        linear-gradient(180deg,var(--bg-2) 0%,var(--bg) 55%);
      color:var(--text);
      font-family:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
      overflow:hidden;                     /* tela única: zero rolagem */
    }

    /* Coluna única de altura fixa. A arte é o único bloco elástico:
       ela absorve a sobra e cede espaço quando o resto precisa. */
    .screen{
      position:relative;                   /* âncora da arte de fundo */
      height:100svh; height:100dvh;
      max-width:460px;margin:0 auto;
      display:flex;flex-direction:column;justify-content:flex-end;
      padding:0 16px calc(max(env(safe-area-inset-bottom),8px));
    }

    /* ===== Selo ===== */
    .topbar{
      position:relative;z-index:2;
      flex:0 0 auto;
      display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
      padding:clamp(5px,1svh,9px) 4px;
    }
    .selo{
      display:inline-flex;align-items:center;gap:7px;
      padding:4px 10px;border-radius:999px;
      background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.42);
      font-size:10.5px;font-weight:700;letter-spacing:.07em;
      text-transform:uppercase;color:var(--ok);white-space:nowrap;
    }
    .selo .dot{
      width:6px;height:6px;border-radius:50%;background:var(--ok);
      animation:pulse 1.8s cubic-bezier(0,0,.2,1) infinite;
    }
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}
      70%{box-shadow:0 0 0 8px rgba(37,211,102,0)}
      100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}
    }
    .clock{font-size:10.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

    /* ===== Arte =====
       Camada de fundo de verdade: cobre a tela inteira por tras do
       conteudo. Antes ela era um bloco no fluxo e terminava num corte
       seco no meio da tela. */
    .art{
      position:absolute;inset:0;z-index:0;
      margin:0;max-height:none;overflow:hidden;
    }
    .art img{
      width:100%;height:100%;display:block;
      object-fit:var(--art-fit,cover);
      /* --art-y sobe ou desce o enquadramento: menor puxa a arte pra
         cima, maior puxa pra baixo. Vem do config. */
      object-position:50% var(--art-y,42%);
      /* Puxa a arte pra cima pra os bilhetes terminarem antes do
         texto. O vao que sobra embaixo cai no preto do fundo, que e
         o mesmo preto da arte, entao a emenda nao aparece. */
      transform:translateY(var(--art-subir,0));
    }
    /* Veu: comeca so DEPOIS dos bilhetes, pra nao escurecer a prova.
       Ele existe pra o texto assentar e pra sumir a emenda do pe da
       arte com o fundo, nao pra dar clima. */
    .art::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(180deg,
        rgba(11,12,16,0) 0%,
        rgba(11,12,16,0) 68%,
        rgba(11,12,16,.45) 78%,
        rgba(11,12,16,.88) 87%,
        var(--bg) 95%);
      pointer-events:none;z-index:1;
    }
    /* Glow por cima da arte. A intensidade fica no --glow: 1 e o padrao,
       abaixe pra apagar e suba pra acender, sem mexer no gradiente. */
    .art .glow{
      position:absolute;inset:0;pointer-events:none;z-index:2;
      opacity:var(--glow,0);
      background:radial-gradient(125% 62% at 50% -10%,
        rgba(255,145,40,.19) 0%,
        rgba(255,122,0,.105) 34%,
        rgba(255,122,0,.045) 58%,
        rgba(255,122,0,0) 80%);
      mix-blend-mode:screen;
    }
    .art.vazio{
      display:flex;
      border:1.5px dashed rgba(255,122,0,.35);
      background:rgba(255,122,0,.04);
      align-items:center;justify-content:center;
      color:#5b6270;font-size:12px;text-align:center;padding:14px;
    }


    /* ===== Headline =====
       --sobe levanta o bloco de venda inteiro (headline + odds + botão).
       Como a sobra acima dele é elástica, aumentar essa margem sobe o
       bloco sem tirar o rodapé do pé da tela. */
    .pitch{
      position:relative;z-index:2;
      flex:0 0 auto;padding-top:clamp(12px,2.1svh,19px);text-align:center;
      margin-bottom:var(--sobe,clamp(6px,1.4svh,14px));
    }
    h1{
      font-family:"Anton",Impact,sans-serif;font-weight:400;
      /* Headline grande de proposito: e ela que carrega a oferta. A arte
         cede altura pra ela, entao ao trocar o texto confira que a pagina
         nao ganhou rolagem. */
      font-size:clamp(34px,11.5vw,56px);line-height:0.98;
      text-transform:uppercase;letter-spacing:.01em;
      text-shadow:0 2px 20px rgba(0,0,0,.7);   /* legível sobre a foto */
    }
    h1 .prize{color:var(--hot);text-shadow:0 0 22px rgba(255,122,0,.45)}

    /* ===== Comparação de odds ===== */
    .odds{
      display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px;
      /* Respiro entre a headline e o comparativo. Em svh pra encolher
         sozinho em tela baixa e nao empurrar o botao pra fora da dobra. */
      margin-top:clamp(10px,2svh,18px);
    }
    .odd-box{
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
      padding:clamp(6px,.9svh,9px) 6px;border-radius:10px;
      background:var(--card);border:1px solid var(--border);
    }
    .odd-box .n{
      font-family:"Anton",Impact,sans-serif;
      font-size:clamp(20px,6vw,27px);line-height:1;white-space:nowrap;
    }
    .odd-box .l{font-size:9.5px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
    .odd-box.win{
      background:linear-gradient(180deg,rgba(255,122,0,.16),rgba(255,122,0,.05));
      border:1.5px solid rgba(255,122,0,.5);
    }
    .odd-box.win .n{color:var(--hot-2)}
    .odd-sep{
      display:flex;align-items:center;justify-content:center;
      font-family:"Anton",Impact,sans-serif;font-size:17px;color:var(--hot);
    }

    /* ===== Botão =====
       Chapado, canto reto e aresta inferior sólida no lugar do brilho.
       Sem gradiente, sem glow e sem animação pulsando. */
    .cta{
      position:relative;overflow:hidden;   /* prende o brilho dentro do botão */
      display:flex;align-items:center;justify-content:center;
      width:100%;
      min-height:clamp(54px,7.6svh,64px);
      margin-top:clamp(18px,3.2svh,30px);padding:14px 18px;
      background:var(--hot);color:#fff;
      font:700 clamp(15px,4.4vw,18px)/1.15 "Sora",sans-serif;
      letter-spacing:.03em;text-transform:uppercase;text-align:center;
      text-decoration:none;
      border-radius:8px;
      border-bottom:3px solid var(--hot-deep);
      -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;
      cursor:pointer;
      transition:background .12s ease,transform .12s ease,border-bottom-width .12s ease;
    }
    .cta:active{
      background:#f07300;
      transform:translateY(2px);
      border-bottom-width:1px;
    }
    /* Brilho atravessando o botão: passa rápido e some, com uma pausa
       longa entre uma passada e outra. A ideia é chamar o olho de volta
       de vez em quando, não ficar pulsando. */
    .cta::after{
      content:"";
      position:absolute;top:0;bottom:0;left:-60%;width:52%;
      background:linear-gradient(100deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,.5) 50%,
        rgba(255,255,255,0) 100%);
      transform:skewX(-18deg);
      pointer-events:none;
      animation:brilho 3s ease-in-out infinite;
    }
    @keyframes brilho{
      0%   { left:-60% }
      26%  { left:135% }
      100% { left:135% }   /* fica fora de cena o resto do ciclo */
    }

    /* ===== Rodapé ===== */
    .rodape{
      position:relative;z-index:2;
      flex:0 0 auto;
      margin-top:clamp(7px,1.1svh,10px);
      text-align:center;
    }
    .rodape .idade{
      display:flex;align-items:center;justify-content:center;gap:6px;
      font-size:10.5px;font-weight:600;color:var(--muted);
    }
    .rodape .age{
      display:inline-grid;place-items:center;
      min-width:26px;height:18px;padding:0 5px;border-radius:4px;
      background:#c62828;color:#fff;font-weight:700;font-size:10px;
    }
    .rodape .termos{
      margin-top:4px;
      font-size:8.5px;line-height:1.35;color:#5b6270;
    }
    .rodape a{color:#5b6270;text-decoration:underline;text-underline-offset:2px}

    /* caso extremo (paisagem, teclado aberto): melhor rolar do que cortar o CTA */
    /* Tela baixa (paisagem, teclado aberto, celular antigo). Abaixo disso
       a arte seria espremida a ponto de cortar os bilhetes. Melhor deixar
       rolar do que entregar a prova da oferta pela metade. */
    @media (max-height:600px){
      body{overflow:auto}
      .screen{height:auto;min-height:100dvh}
      /* Headline um pouco menor aqui devolve altura pra arte. */
      h1{font-size:clamp(34px,12vw,44px)}
      .pitch{margin-bottom:0}
    }
    @media (prefers-reduced-motion:reduce){
      .selo .dot,.cta::after{animation:none}
      .cta::after{display:none}
    }
  </style>

  <script src="config.js"></script>

  <!-- ===== Meta Pixel ===== -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','23904277939190271');

  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=23904277939190271&ev=PageView&noscript=1" alt="" /><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2392917637871836&ev=PageView&noscript=1" alt="" /></noscript>

</head>
<body>

  <main class="screen">

    <div class="topbar">
      <span class="selo"><span class="dot"></span><span id="selo-txt">Bilhete disponível</span></span>
      <span class="clock" id="clock"></span>
    </div>

    <div class="art" id="art">
      <img id="art-img" src="" alt="" fetchpriority="high" decoding="async" />
      <span class="glow"></span>
    </div>

    <div class="pitch">
      <h1 id="headline">De R$ 30 pra <span class="prize">R$ 3.000</span></h1>

      <div class="odds">
        <div class="odd-box">
          <span class="n" id="odd-de">odd 9</span>
          <span class="l">nas outras casas</span>
        </div>
        <span class="odd-sep">&rarr;</span>
        <div class="odd-box win">
          <span class="n" id="odd-para">odd 100</span>
          <span class="l">nesse bilhete</span>
        </div>
      </div>

      <a id="cta" class="cta" href="#" rel="noopener">Quero esse bilhete</a>
    </div>

    <footer class="rodape">
      <p class="idade"><span class="age">+18</span> Jogue com responsabilidade <a id="suporte" href="#" rel="noopener">Suporte</a></p>
      <p class="termos" id="termos"></p>
    </footer>

  </main>

  <script>
    (function(){
      "use strict";
      var C = window.LP_CONFIG || {};

      /* ===== Arte ===== */
      var art = document.getElementById("art");
      var img = document.getElementById("art-img");
      art.style.setProperty("--art-fit", C.arteAjuste === "cover" ? "cover" : "contain");
      if (C.arteFoco) art.style.setProperty("--art-y", C.arteFoco);
      if (C.arteSubir) art.style.setProperty("--art-subir", "-" + String(C.arteSubir).replace("-", ""));

      function semArte(){
        if (img.parentNode) img.remove();
        art.classList.add("vazio");
        art.textContent = "espaço da arte — coloque o arquivo em /assets e aponte em config.js";
      }
      if (!C.arte) { semArte(); }
      else { img.addEventListener("error", semArte); img.src = C.arte; }

      /* ===== Textos ===== */
      function set(id, txt){ if (txt != null) document.getElementById(id).textContent = txt; }

      /* Headline: *entre asteriscos* sai laranja e \n vira quebra de linha.
         Escapa antes de montar, pra o config nunca virar HTML solto. */
      if (C.headline) {
        var seguro = String(C.headline).replace(/[&<>"]/g, function(c){
          return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
        });
        document.getElementById("headline").innerHTML = seguro
          .split("*").map(function(parte, i){
            return i % 2 ? '<span class="prize">' + parte + "</span>" : parte;
          }).join("")
          .replace(/\n/g, "<br>");
      }

      set("odd-de", C.oddDe);
      set("odd-para", C.oddPara);
      set("cta", C.ctaLabel);
      if (C.selo) { set("selo-txt", C.selo); }
      else { var selo = document.querySelector(".selo"); if (selo) selo.remove(); }
      set("termos", C.termos);
      if (C.tituloAba) document.title = C.tituloAba;

      /* ===== Contagem (opcional) =====
         Só aparece se houver deadline no config. Sem ele, o elemento sai
         do DOM pra não deixar folga no topo. Quando o prazo passa a
         contagem some sozinha e o selo continua "disponível": a página
         nunca diz que a pessoa chegou tarde. */
      var clock  = document.getElementById("clock");
      var target = C.deadline ? new Date(C.deadline).getTime() : 0;
      function pad(n){ return String(n).padStart(2,"0"); }
      function tick(){
        var diff = target - Date.now();
        if (diff <= 0){ if (clock.parentNode) clock.remove(); return; }
        var h = Math.floor(diff/3600000), m = Math.floor(diff/60000)%60, s = Math.floor(diff/1000)%60;
        clock.textContent = "sai do ar em " + (h>=24 ? Math.floor(h/24)+"d " : "") + pad(h%24)+":"+pad(m)+":"+pad(s);
        setTimeout(tick, 1000);
      }
      if (target) { tick(); } else { clock.remove(); }

      /* Sem selo e sem contagem a barra do topo fica vazia: ela sai
         de cena pra nao roubar altura da arte. */
      var topbar = document.querySelector(".topbar");
      if (topbar && !topbar.querySelector("*")) topbar.remove();

      /* ===== Link + evento ===== */
      var p   = new URLSearchParams(location.search);
      var uS  = p.get("utm_source")   || "direct";
      var uC  = p.get("utm_campaign") || "organic";
      var uCt = p.get("utm_content")  || "default";
      var uM  = p.get("utm_medium")   || "";

      var destino = C.link || "#";
      if (C.repassarParametros && location.search) {
        destino += (destino.indexOf("?") === -1 ? "?" : "&") + location.search.slice(1);
      }

      var eventId = "lead_" + Date.now() + "_" + Math.random().toString(36).slice(2,10);
      var fired = false;
      function fire(){
        if (fired) return; fired = true;
        if (typeof window.fbq === "function") {
          window.fbq("track","Lead",{content_name:"30 pra 3000",content_category:uC,source:uS,utm_medium:uM,utm_content:uCt},{eventID:eventId});
        }
        if (typeof window.va === "function") {
          window.va("event",{name:"clique_3000",data:{source:uS,campaign:uC,content:uCt,medium:uM}});
        }
      }

      var cta = document.getElementById("cta");
      cta.href = destino; cta.target = "_blank"; cta.rel = "noopener";
      cta.addEventListener("pointerdown", fire, {passive:true});
      cta.addEventListener("click", fire);

      var sup = document.getElementById("suporte");
      if (C.linkSuporte) {
        sup.href = C.linkSuporte; sup.target = "_blank"; sup.rel = "noopener";
        sup.addEventListener("click", function(){
          if (typeof window.fbq === "function") window.fbq("trackCustom","SupportClick",{content_name:"30 pra 3000"});
        });
      } else { sup.remove(); }
    })();
  </script>

  <script>
    (function(){
      var HUB='https://hub-omega-sooty.vercel.app';
      fetch(HUB+'/api/track',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({page:'3000',event:'pageview',referrer:document.referrer}),
        keepalive:true
      }).catch(function(){});
    })();
  </script>
</body>
</html>
